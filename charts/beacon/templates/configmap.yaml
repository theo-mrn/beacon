apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-scoring
  namespace: {{ .Values.namespace }}
data:
  scoring.yaml: |
    # Règles de scoring Beacon — modifie et apply sans rebuilder l'image.
    ports:
      - port: 22
        name: SSH
        risk: HIGH
      - port: 23
        name: Telnet
        risk: HIGH
      - port: 3306
        name: MySQL
        risk: HIGH
      - port: 5432
        name: PostgreSQL
        risk: HIGH
      - port: 6379
        name: Redis
        risk: HIGH
      - port: 27017
        name: MongoDB
        risk: HIGH
      - port: 9200
        name: Elasticsearch
        risk: HIGH
      - port: 9300
        name: Elasticsearch (cluster)
        risk: HIGH
      - port: 2379
        name: etcd
        risk: HIGH
      - port: 2380
        name: etcd (peer)
        risk: HIGH
      - port: 5984
        name: CouchDB
        risk: HIGH
      - port: 8086
        name: InfluxDB
        risk: HIGH

    exposure_defaults:
      NodePort: MEDIUM
      LoadBalancer: MEDIUM
      Ingress: LOW
      IngressRoute: LOW
