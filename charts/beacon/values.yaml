image:
  repository: ghcr.io/theo-mrn/beacon

  tag: "sha-9cbf1db"


  pullPolicy: IfNotPresent

namespace: beacon

service:
  port: 8080

ingress:
  enabled: false
  host: beacon.cluster.local
  tls: false

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 256Mi

persistence:
  enabled: true
  size: 256Mi
  storageClass: ""

# Intégration Trivy (optionnel)
trivy:
  dashboardURL: ""

# Notifications webhook (optionnel)
webhooks:
  slack: ""
  teams: ""
  discord: ""
  generic: ""

# Intégration CrowdSec
# apiKey : clé générée via cscli bouncers add beacon
crowdsec:
  lapiURL: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
  apiKey: ""

# Intégration Falco + Lynis via Loki
loki:
  url: "http://loki.monitoring.svc.cluster.local:3100"
