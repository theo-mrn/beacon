<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Beacon — Vulnérabilités</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hidden-row { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 h-14 flex items-center gap-4">
      <a href="/" class="flex items-center gap-2 text-slate-700 hover:text-indigo-600 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z"/>
        </svg>
        <span class="text-sm font-semibold">Beacon</span>
      </a>
      <span class="text-slate-300">/</span>
      <span class="text-sm font-semibold text-slate-900">Vulnérabilités</span>
      <div class="ml-auto flex items-center gap-3">
        <span id="total-label" class="text-xs text-slate-400"></span>
        <a href="/" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 transition-colors">← Dashboard</a>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-6">

    <!-- Stats + Filtres -->
    <div class="flex flex-wrap items-center gap-3 mb-6">
      <!-- Severity filters -->
      <div class="flex items-center gap-2">
        <button onclick="setSev('ALL')"   id="sev-ALL"      class="sev-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white">Tous</button>
        <button onclick="setSev('CRITICAL')" id="sev-CRITICAL" class="sev-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:bg-red-50 hover:text-red-700 hover:border-red-200 transition-colors">CRITICAL</button>
        <button onclick="setSev('HIGH')"  id="sev-HIGH"     class="sev-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-600 hover:bg-orange-50 hover:text-orange-700 hover:border-orange-200 transition-colors">HIGH</button>
      </div>

      <div class="w-px h-5 bg-slate-200"></div>

      <!-- Fix filter -->
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="fix-only" onchange="applyFilters()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-300"/>
        <span class="text-xs font-medium text-slate-600">Fix disponible uniquement</span>
      </label>

      <div class="w-px h-5 bg-slate-200"></div>

      <!-- Namespace filter -->
      <select id="ns-filter" onchange="applyFilters()" class="text-xs border border-slate-200 rounded-lg px-3 py-1.5 bg-white text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-300">
        <option value="">Tous les namespaces</option>
      </select>

      <!-- Search -->
      <div class="relative ml-auto">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <input id="search" type="search" placeholder="CVE, package, namespace…"
          class="pl-8 pr-4 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300 w-56"/>
      </div>
    </div>

    <!-- Stats cards -->
    <div class="grid grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl border border-slate-200 px-5 py-4">
        <p class="text-xs font-medium text-slate-500 mb-1">Total CVEs</p>
        <p id="stat-total" class="text-2xl font-bold text-slate-900">—</p>
      </div>
      <div class="bg-white rounded-xl border border-red-100 px-5 py-4">
        <p class="text-xs font-medium text-slate-500 mb-1">Critical</p>
        <p id="stat-critical" class="text-2xl font-bold text-red-600">—</p>
      </div>
      <div class="bg-white rounded-xl border border-orange-100 px-5 py-4">
        <p class="text-xs font-medium text-slate-500 mb-1">High</p>
        <p id="stat-high" class="text-2xl font-bold text-orange-600">—</p>
      </div>
      <div class="bg-white rounded-xl border border-emerald-100 px-5 py-4">
        <p class="text-xs font-medium text-slate-500 mb-1">Fix disponible</p>
        <p id="stat-fix" class="text-2xl font-bold text-emerald-600">—</p>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50">
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-5 py-3 w-28">Sévérité</th>
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3 w-16">Score</th>
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3 w-44">CVE</th>
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3">Titre</th>
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3 w-40">Package</th>
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3 w-32">Namespace</th>
            <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-3 w-28">Fix</th>
          </tr>
        </thead>
        <tbody id="cve-table" class="divide-y divide-slate-100">
          <tr><td colspan="7" class="text-center py-16 text-slate-400 text-sm">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
    <p id="empty-state" class="hidden text-center py-8 text-slate-400 text-sm">Aucune vulnérabilité correspondante</p>
  </div>

<script>
let ALL_CVES = [];
let activeSev = 'ALL';

const sevColor = s => s === 'CRITICAL'
  ? 'bg-red-100 text-red-700 border-red-200'
  : 'bg-orange-100 text-orange-700 border-orange-200';

const scoreColor = s => {
  if (s >= 9) return 'text-red-600 font-bold';
  if (s >= 7) return 'text-orange-600 font-semibold';
  return 'text-slate-600';
};

async function load() {
  const res = await fetch('/api/cves');
  ALL_CVES = await res.json() || [];

  // Tri : CRITICAL d'abord, puis par score décroissant
  ALL_CVES.sort((a, b) => {
    if (a.severity !== b.severity) return a.severity === 'CRITICAL' ? -1 : 1;
    return (b.score || 0) - (a.score || 0);
  });

  // Stats
  const critical = ALL_CVES.filter(c => c.severity === 'CRITICAL').length;
  const high = ALL_CVES.filter(c => c.severity === 'HIGH').length;
  const withFix = ALL_CVES.filter(c => c.fixed_version).length;
  document.getElementById('stat-total').textContent = ALL_CVES.length;
  document.getElementById('stat-critical').textContent = critical;
  document.getElementById('stat-high').textContent = high;
  document.getElementById('stat-fix').textContent = withFix;

  // Namespaces
  const nsSel = document.getElementById('ns-filter');
  const nsList = [...new Set(ALL_CVES.map(c => c.namespace))].sort();
  nsList.forEach(ns => {
    const opt = document.createElement('option');
    opt.value = ns; opt.textContent = ns;
    nsSel.appendChild(opt);
  });

  renderTable(ALL_CVES);
}

function renderTable(cves) {
  const tbody = document.getElementById('cve-table');
  if (cves.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('empty-state').classList.remove('hidden');
    document.getElementById('total-label').textContent = '0 vulnérabilité';
    return;
  }
  document.getElementById('empty-state').classList.add('hidden');
  document.getElementById('total-label').textContent = cves.length + ' vulnérabilité' + (cves.length > 1 ? 's' : '');

  tbody.innerHTML = cves.map(c => `
<tr class="hover:bg-slate-50/70 transition-colors" data-sev="${c.severity}" data-ns="${c.namespace}" data-search="${(c.id+' '+c.package+' '+c.namespace+' '+c.title).toLowerCase()}">
  <td class="px-5 py-3">
    <span class="inline-flex items-center text-xs font-semibold px-2.5 py-1 rounded-full border ${sevColor(c.severity)}">${c.severity}</span>
  </td>
  <td class="px-4 py-3">
    <span class="text-sm ${scoreColor(c.score || 0)}">${c.score ? c.score.toFixed(1) : '—'}</span>
  </td>
  <td class="px-4 py-3">
    <a href="${c.primary_link || 'https://osv.dev/vulnerability/'+c.id}" target="_blank" rel="noopener"
      class="font-mono text-xs text-indigo-600 hover:text-indigo-800 hover:underline">${c.id} ↗</a>
  </td>
  <td class="px-4 py-3">
    <p class="text-sm text-slate-700 line-clamp-2">${c.title || '—'}</p>
    <p class="text-xs text-slate-400 mt-0.5 font-mono">${c.app} · ${c.container || ''}</p>
  </td>
  <td class="px-4 py-3">
    <p class="font-mono text-xs text-slate-700">${c.package}</p>
    <p class="font-mono text-xs text-slate-400">${c.installed_version}</p>
  </td>
  <td class="px-4 py-3">
    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">${c.namespace}</span>
  </td>
  <td class="px-4 py-3">
    ${c.fixed_version
      ? `<span class="font-mono text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded">${c.fixed_version}</span>`
      : `<span class="text-xs text-slate-400">—</span>`}
  </td>
</tr>`).join('');
}

function setSev(sev) {
  activeSev = sev;
  document.querySelectorAll('.sev-btn').forEach(b => {
    b.classList.remove('bg-slate-900', 'text-white', 'bg-red-600', 'bg-orange-500');
    b.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-600');
  });
  const el = document.getElementById('sev-' + sev);
  el.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-600');
  if (sev === 'CRITICAL') el.classList.add('bg-red-600', 'text-white');
  else if (sev === 'HIGH') el.classList.add('bg-orange-500', 'text-white');
  else el.classList.add('bg-slate-900', 'text-white');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const ns = document.getElementById('ns-filter').value;
  const fixOnly = document.getElementById('fix-only').checked;

  const filtered = ALL_CVES.filter(c => {
    if (activeSev !== 'ALL' && c.severity !== activeSev) return false;
    if (ns && c.namespace !== ns) return false;
    if (fixOnly && !c.fixed_version) return false;
    if (q && !(c.id+' '+c.package+' '+c.namespace+' '+c.title).toLowerCase().includes(q)) return false;
    return true;
  });
  renderTable(filtered);
}

document.getElementById('search').addEventListener('input', applyFilters);
load();
</script>
</body>
</html>
