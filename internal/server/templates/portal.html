<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Beacon — Portail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .card-link { transition: box-shadow 0.15s ease, transform 0.15s ease; }
    .card-link:hover { box-shadow: 0 4px 24px 0 rgba(99,102,241,0.10); transform: translateY(-1px); }
    .hidden-card { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 h-14 flex items-center gap-4">
      <a href="/" class="flex items-center gap-2.5 text-slate-800 hover:text-indigo-600 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z"/>
        </svg>
        <span class="text-sm font-semibold">Beacon</span>
      </a>
      <span class="text-slate-300">/</span>
      <span class="text-sm font-semibold text-slate-900">Portail des services</span>

      <!-- Search -->
      <div class="flex-1 max-w-md ml-4 relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <input id="search" type="search" placeholder="Rechercher un service, une URL…"
          class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 placeholder:text-slate-400 transition"/>
      </div>

      <div class="ml-auto flex items-center gap-3">
        <span class="text-xs text-slate-400" id="count-label">{{.Total}} services</span>
        <a href="/" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 transition-colors">← Tableau de bord</a>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-6 flex gap-6">

    <!-- Sidebar namespaces -->
    <aside class="w-52 flex-shrink-0">
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden sticky top-20">
        <div class="px-4 py-3 border-b border-slate-100">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Namespaces</p>
        </div>
        <nav class="py-1">
          <button onclick="filterNs('all')" data-ns="all"
            class="ns-btn w-full text-left px-4 py-2 text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-50 transition-colors flex items-center justify-between">
            Tous
            <span class="text-xs font-semibold text-slate-500" id="ns-count-all">{{.Total}}</span>
          </button>
          {{.NsButtons}}
        </nav>
      </div>
    </aside>

    <!-- Cards grid -->
    <main class="flex-1 min-w-0">
      <div id="empty-state" class="hidden flex-col items-center justify-center py-24 text-center">
        <svg class="w-12 h-12 text-slate-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <p class="text-slate-500 font-medium">Aucun service trouvé</p>
        <p class="text-slate-400 text-sm mt-1">Essayez un autre terme de recherche</p>
      </div>
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        {{.Cards}}
      </div>
    </main>
  </div>

  <script>
    let activeNs = 'all';

    function filterNs(ns) {
      activeNs = ns;
      document.querySelectorAll('.ns-btn').forEach(b => {
        const active = b.dataset.ns === ns;
        b.classList.toggle('bg-indigo-50', active);
        b.classList.toggle('text-indigo-700', active);
        b.classList.toggle('font-medium', active);
        b.classList.toggle('text-slate-600', !active);
      });
      applyFilters();
    }

    const searchEl = document.getElementById('search');
    searchEl.addEventListener('input', applyFilters);

    function applyFilters() {
      const q = searchEl.value.toLowerCase().trim();
      let visible = 0;
      document.querySelectorAll('.service-card').forEach(card => {
        const nsMatch = activeNs === 'all' || card.dataset.ns === activeNs;
        const text = card.dataset.search || '';
        const qMatch = !q || text.includes(q);
        const show = nsMatch && qMatch;
        card.classList.toggle('hidden-card', !show);
        if (show) visible++;
      });
      document.getElementById('count-label').textContent = visible + ' service' + (visible !== 1 ? 's' : '');
      const empty = document.getElementById('empty-state');
      if (visible === 0) { empty.classList.remove('hidden'); empty.classList.add('flex'); }
      else { empty.classList.add('hidden'); empty.classList.remove('flex'); }
    }
  </script>
</body>
</html>
